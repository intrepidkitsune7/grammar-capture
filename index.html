<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="文法メモ"/>
<meta name="theme-color" content="#111111"/>
<title>文法メモ</title>
<style>
:root {
  --bg: #111; --card: #1c1c1e; --card2: #242426; --border: #2c2c2e;
  --text: #f0f0f0; --muted: #888; --accent: #f97316; --accent-dim: rgba(249,115,22,0.15);
  --blue: #3b82f6; --green: #22c55e; --red: #ef4444;
  --n5: #22c55e; --n4: #3b82f6; --n3: #f59e0b; --n2: #f97316; --n1: #a855f7;
  --radius: 14px; --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Hiragino Sans','Hiragino Kaku Gothic ProN',-apple-system,sans-serif; overscroll-behavior: none; }
#app { display: flex; flex-direction: column; height: 100%; max-width: 480px; margin: 0 auto; }

header { padding: 16px 20px 12px; padding-top: calc(16px + env(safe-area-inset-top,0px)); border-bottom: 1px solid var(--border); background: rgba(17,17,17,.95); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 10; }
.header-title { display: flex; align-items: baseline; gap: 8px; }
.header-title h1 { font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
.header-title span { font-size: 12px; color: var(--muted); }

.tabbar { display: flex; border-bottom: 1px solid var(--border); background: var(--bg); }
.tab-btn { flex: 1; padding: 11px 0; font-size: 13px; font-weight: 500; color: var(--muted); background: none; border: none; cursor: pointer; border-bottom: 2px solid transparent; transition: all .15s; }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

.screen { flex: 1; overflow-y: auto; padding: 20px; display: none; flex-direction: column; gap: 14px; padding-bottom: calc(24px + var(--safe-bottom)); }
.screen.active { display: flex; }

label { font-size: 11px; font-weight: 600; letter-spacing: .07em; color: var(--muted); text-transform: uppercase; display: block; margin-bottom: 6px; }
.field-group { display: flex; flex-direction: column; }
input[type=text], textarea { background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 12px 14px; font-size: 16px; font-family: inherit; width: 100%; outline: none; transition: border-color .15s; -webkit-appearance: none; }
input[type=text]:focus, textarea:focus { border-color: var(--accent); }
textarea { resize: none; min-height: 80px; line-height: 1.5; }
.pattern-input { font-size: 22px !important; font-weight: 600; text-align: center; }

.pattern-row { display: flex; gap: 8px; align-items: stretch; }
.pattern-row input { flex: 1; min-width: 0; }
.icon-btn { width: 48px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; flex-shrink: 0; }
.icon-btn:active { background: var(--card2); transform: scale(.94); }
#camera-input { display: none; }

/* JLPT row */
.jlpt-label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.jlpt-auto-status { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; min-height: 16px; }
.mini-spinner { display: inline-block; width: 10px; height: 10px; border: 1.5px solid rgba(255,255,255,.2); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
.jlpt-row { display: flex; gap: 6px; }
.jlpt-btn { flex: 1; padding: 10px 4px; border-radius: 8px; font-size: 13px; font-weight: 700; border: 1px solid var(--border); background: var(--card); color: var(--muted); cursor: pointer; transition: all .15s; letter-spacing: .02em; }
.jlpt-btn:active { transform: scale(.95); }
.jlpt-btn.selected-N5 { background: rgba(34,197,94,.15);  border-color: var(--n5); color: var(--n5); }
.jlpt-btn.selected-N4 { background: rgba(59,130,246,.15); border-color: var(--n4); color: var(--n4); }
.jlpt-btn.selected-N3 { background: rgba(245,158,11,.15); border-color: var(--n3); color: var(--n3); }
.jlpt-btn.selected-N2 { background: rgba(249,115,22,.15); border-color: var(--n2); color: var(--n2); }
.jlpt-btn.selected-N1 { background: rgba(168,85,247,.15); border-color: var(--n1); color: var(--n1); }

.jlpt-badge { font-size: 11px; font-weight: 700; border-radius: 6px; padding: 3px 8px; letter-spacing: .05em; }
.badge-N5 { background: rgba(34,197,94,.15);  color: var(--n5); }
.badge-N4 { background: rgba(59,130,246,.15); color: var(--n4); }
.badge-N3 { background: rgba(245,158,11,.15); color: var(--n3); }
.badge-N2 { background: rgba(249,115,22,.15); color: var(--n2); }
.badge-N1 { background: rgba(168,85,247,.15); color: var(--n1); }

.btn-row { display: flex; gap: 10px; }
.lookup-btn, .bunpro-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; padding: 13px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; text-decoration: none; border: 1px solid var(--border); background: none; }
.lookup-btn  { background: var(--accent-dim); border-color: rgba(249,115,22,.4); color: var(--accent); }
.bunpro-btn  { background: var(--card); color: var(--blue); border-color: rgba(59,130,246,.3); }
.lookup-btn:active, .bunpro-btn:active { transform: scale(.97); }

.divider { height: 1px; background: var(--border); }
.save-btn { display: flex; align-items: center; justify-content: center; background: var(--accent); border: none; color: #fff; border-radius: 12px; padding: 15px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all .15s; width: 100%; }
.save-btn:active { transform: scale(.97); filter: brightness(.9); }

/* Log */
.log-toolbar { display: flex; align-items: center; gap: 8px; }
.log-search { flex: 1; background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 10px 14px; font-size: 15px; font-family: inherit; outline: none; -webkit-appearance: none; }
.log-search:focus { border-color: var(--accent); }
.export-btn { padding: 10px 12px; background: var(--card); border: 1px solid var(--border); color: var(--muted); border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all .15s; }
.export-btn:active { background: var(--card2); }

.filter-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.filter-row::-webkit-scrollbar { display: none; }
.filter-pill { flex-shrink: 0; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid var(--border); background: var(--card); color: var(--muted); cursor: pointer; transition: all .15s; white-space: nowrap; }
.filter-pill:active { transform: scale(.95); }
.filter-pill.active-all  { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
.filter-pill.active-N5   { background: rgba(34,197,94,.15);  border-color: var(--n5); color: var(--n5); }
.filter-pill.active-N4   { background: rgba(59,130,246,.15); border-color: var(--n4); color: var(--n4); }
.filter-pill.active-N3   { background: rgba(245,158,11,.15); border-color: var(--n3); color: var(--n3); }
.filter-pill.active-N2   { background: rgba(249,115,22,.15); border-color: var(--n2); color: var(--n2); }
.filter-pill.active-N1   { background: rgba(168,85,247,.15); border-color: var(--n1); color: var(--n1); }
.filter-pill.active-none { background: rgba(136,136,136,.15); border-color: var(--muted); color: var(--muted); }

.pending-badge { font-size: 12px; color: var(--accent); font-weight: 600; }
.log-entry { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.log-entry-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.log-pattern { font-size: 20px; font-weight: 700; flex: 1; min-width: 0; }
.log-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.log-date { font-size: 11px; color: var(--muted); }
.log-source { font-size: 12px; color: var(--muted); }
.log-notes { font-size: 13px; color: #ccc; line-height: 1.55; }
.log-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.log-action-btn { flex: 1; min-width: 52px; padding: 10px 6px; border-radius: 8px; font-size: 12px; font-weight: 600; border: 1px solid var(--border); background: var(--card2); color: var(--muted); cursor: pointer; transition: all .15s; text-decoration: none; display: flex; align-items: center; justify-content: center; }
.log-action-btn:active { transform: scale(.96); }
.log-action-btn.jisho  { color: var(--accent); border-color: rgba(249,115,22,.3); }
.log-action-btn.bunpro { color: var(--blue);   border-color: rgba(59,130,246,.3); }
.log-action-btn.added  { color: var(--green);  border-color: rgba(34,197,94,.3); }
.log-action-btn.del    { color: var(--red);    border-color: rgba(239,68,68,.3); }
.added-badge { font-size: 11px; font-weight: 600; background: rgba(34,197,94,.15); color: var(--green); border-radius: 6px; padding: 3px 8px; white-space: nowrap; }

.empty-state { text-align: center; color: var(--muted); font-size: 14px; padding: 48px 0; line-height: 1.8; }
.empty-state .big { font-size: 40px; margin-bottom: 12px; }

/* OCR Modal */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 50; display: none; flex-direction: column; padding-top: env(safe-area-inset-top,0px); }
.modal-backdrop.open { display: flex; }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 12px; border-bottom: 1px solid var(--border); }
.modal-header h2 { font-size: 16px; font-weight: 700; }
.modal-close { background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; padding: 4px; }
.modal-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.ocr-preview { width: 100%; max-height: 180px; object-fit: contain; border-radius: 10px; border: 1px solid var(--border); display: none; }
.ocr-preview.visible { display: block; }
.ocr-status { font-size: 13px; color: var(--muted); text-align: center; padding: 8px 0; min-height: 32px; }
.ocr-progress { background: var(--card2); border-radius: 8px; overflow: hidden; height: 4px; }
.ocr-progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width .3s; border-radius: 8px; }
.ocr-results-label { font-size: 11px; font-weight: 600; letter-spacing: .07em; color: var(--muted); text-transform: uppercase; }
.ocr-results { display: flex; flex-direction: column; gap: 6px; }
.ocr-line { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; font-size: 16px; cursor: pointer; transition: all .15s; line-height: 1.5; word-break: break-all; }
.ocr-line:active { background: var(--accent-dim); border-color: var(--accent); transform: scale(.98); }
.ocr-hint { font-size: 13px; color: var(--muted); text-align: center; line-height: 1.7; padding: 8px 0; }
.loading-spinner { display: block; width: 22px; height: 22px; border: 2px solid rgba(255,255,255,.15); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; margin: 12px auto; }
@keyframes spin { to { transform: rotate(360deg); } }

.toast { position: fixed; bottom: calc(24px + var(--safe-bottom)); left: 50%; transform: translateX(-50%) translateY(20px); background: var(--card2); border: 1px solid var(--border); color: var(--text); border-radius: 20px; padding: 10px 18px; font-size: 13px; font-weight: 500; opacity: 0; transition: all .25s; pointer-events: none; z-index: 200; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-title"><h1>文法メモ</h1><span>Grammar Capture</span></div>
  </header>
  <div class="tabbar">
    <button class="tab-btn active" id="tab-capture" onclick="showTab('capture')">＋ Capture</button>
    <button class="tab-btn"        id="tab-log"     onclick="showTab('log')">Log</button>
  </div>

  <!-- CAPTURE -->
  <div class="screen active" id="screen-capture">
    <div class="field-group">
      <label>Grammar Pattern</label>
      <div class="pattern-row">
        <input type="text" class="pattern-input" id="input-pattern"
          placeholder="〜てしまう" autocomplete="off" autocorrect="off"
          autocapitalize="none" spellcheck="false" oninput="onPatternInput()"/>
        <button class="icon-btn" onclick="pastePattern()" title="Paste">📋</button>
        <button class="icon-btn" onclick="triggerCamera()" title="Scan">📷</button>
      </div>
    </div>
    <input type="file" id="camera-input" accept="image/*" capture="environment" onchange="handleImage(event)"/>

    <div class="field-group">
      <div class="jlpt-label-row">
        <label style="margin-bottom:0">JLPT Level</label>
        <div class="jlpt-auto-status" id="jlpt-status"></div>
      </div>
      <div class="jlpt-row" id="jlpt-selector">
        <button class="jlpt-btn" data-level="N5" onclick="selectJLPT('N5')">N5</button>
        <button class="jlpt-btn" data-level="N4" onclick="selectJLPT('N4')">N4</button>
        <button class="jlpt-btn" data-level="N3" onclick="selectJLPT('N3')">N3</button>
        <button class="jlpt-btn" data-level="N2" onclick="selectJLPT('N2')">N2</button>
        <button class="jlpt-btn" data-level="N1" onclick="selectJLPT('N1')">N1</button>
      </div>
    </div>

    <div class="field-group">
      <label>Source <span style="font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label>
      <input type="text" id="input-source" placeholder="Book title, show name…" autocomplete="off"/>
    </div>
    <div class="field-group">
      <label>Notes <span style="font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label>
      <textarea id="input-notes" placeholder="Context, what confused you…" rows="3"></textarea>
    </div>

    <div class="btn-row">
      <button class="lookup-btn" onclick="openJisho()">🔍 Jisho</button>
      <button class="bunpro-btn" onclick="openBunpro()">🔗 Bunpro</button>
    </div>
    <div class="divider"></div>
    <button class="save-btn" onclick="doSave()">Save Entry</button>
  </div>

  <!-- LOG -->
  <div class="screen" id="screen-log">
    <div class="log-toolbar">
      <input type="search" class="log-search" id="log-search"
        placeholder="Search patterns, sources…"
        oninput="renderLog()" autocorrect="off" autocapitalize="none"/>
      <button class="export-btn" onclick="exportLog()">Export</button>
    </div>
    <div class="filter-row" id="filter-row">
      <button class="filter-pill active-all" data-filter="all"  onclick="setFilter('all')">All</button>
      <button class="filter-pill" data-filter="N5"   onclick="setFilter('N5')">N5</button>
      <button class="filter-pill" data-filter="N4"   onclick="setFilter('N4')">N4</button>
      <button class="filter-pill" data-filter="N3"   onclick="setFilter('N3')">N3</button>
      <button class="filter-pill" data-filter="N2"   onclick="setFilter('N2')">N2</button>
      <button class="filter-pill" data-filter="N1"   onclick="setFilter('N1')">N1</button>
      <button class="filter-pill" data-filter="none" onclick="setFilter('none')">No level</button>
    </div>
    <div id="pending-info"></div>
    <div id="log-list"></div>
  </div>
</div>

<!-- OCR Modal -->
<div class="modal-backdrop" id="ocr-modal">
  <div class="modal-header">
    <h2>Scan Text</h2>
    <button class="modal-close" onclick="closeOCR()">✕</button>
  </div>
  <div class="modal-body">
    <img id="ocr-preview" class="ocr-preview" alt=""/>
    <div id="ocr-status" class="ocr-status"></div>
    <div id="ocr-progress-wrap" style="display:none"><div class="ocr-progress"><div class="ocr-progress-bar" id="ocr-bar"></div></div></div>
    <div id="ocr-output"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
// ══════════════════════════════════════════════════════════════
// JLPT LOOKUP TABLE — bundled, no network needed
// Keys are grammar patterns without leading 〜／～
// ══════════════════════════════════════════════════════════════

// ══════════════════════════════════════════════════════════════
// JLPT LOOKUP LOGIC
// ══════════════════════════════════════════════════════════════
function lookupJLPT(raw) {
  if (!raw) return null;
  // Strip leading 〜 ～ and whitespace
  const clean = raw.replace(/^[〜～\s]+/, '').trim();
  if (!clean) return null;

  // 1. Exact match
  if (JLPT_DB[clean]) return JLPT_DB[clean];

  // 2. Prefix match — find longest key that the input starts with
  let bestKey = '', bestLevel = null;
  for (const key of Object.keys(JLPT_DB)) {
    if (clean.startsWith(key) && key.length > bestKey.length) {
      bestKey = key; bestLevel = JLPT_DB[key];
    }
  }
  if (bestLevel) return bestLevel;

  // 3. Suffix match — input ends with a known key (for 〜 patterns typed mid-word)
  for (const key of Object.keys(JLPT_DB)) {
    if (clean.endsWith(key) && key.length > bestKey.length) {
      bestKey = key; bestLevel = JLPT_DB[key];
    }
  }
  return bestLevel;
}

// ══════════════════════════════════════════════════════════════
// APP STATE & STORAGE
// ══════════════════════════════════════════════════════════════
const STORAGE_KEY = 'grammar_entries';
let selectedJLPT  = null;
let activeFilter  = 'all';
let jlptDebounce  = null;
let autoDetected  = false;

function loadEntries() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; } }
function saveEntries(e) { localStorage.setItem(STORAGE_KEY, JSON.stringify(e)); }

// ── Tabs ───────────────────────────────────────────────────────
function showTab(tab) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-' + tab).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
  if (tab === 'log') renderLog();
}

// ── Toast ──────────────────────────────────────────────────────
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2400);
}

// ── Pattern input → auto JLPT ─────────────────────────────────
function onPatternInput() {
  clearTimeout(jlptDebounce);
  const val = document.getElementById('input-pattern').value.trim();
  if (!val) { clearJLPTAuto(); return; }
  setJLPTStatus('<span class="mini-spinner"></span>');
  jlptDebounce = setTimeout(() => {
    const level = lookupJLPT(val);
    if (level) {
      applyJLPT(level, true);
      setJLPTStatus(`<span style="color:var(--${level.toLowerCase()})">↑ ${level} detected</span>`);
    } else {
      clearJLPTAuto();
      setJLPTStatus('<span style="color:var(--muted)">not found</span>');
    }
  }, 500);
}

function setJLPTStatus(html) {
  document.getElementById('jlpt-status').innerHTML = html;
}

function clearJLPTAuto() {
  if (autoDetected) { applyJLPT(null, false); autoDetected = false; }
  setJLPTStatus('');
}

function applyJLPT(level, isAuto) {
  autoDetected = isAuto;
  selectedJLPT = level;
  document.querySelectorAll('.jlpt-btn').forEach(b => {
    b.className = 'jlpt-btn' + (b.dataset.level === level ? ' selected-' + level : '');
  });
}

function selectJLPT(level) {
  // Manual tap overrides auto-detection
  clearTimeout(jlptDebounce);
  if (selectedJLPT === level) {
    applyJLPT(null, false);
    setJLPTStatus('');
  } else {
    applyJLPT(level, false);
    setJLPTStatus('');
  }
}

function resetJLPT() {
  applyJLPT(null, false);
  setJLPTStatus('');
}

// ── Paste ──────────────────────────────────────────────────────
async function pastePattern() {
  try {
    const text = await navigator.clipboard.readText();
    if (text.trim()) {
      document.getElementById('input-pattern').value = text.trim();
      onPatternInput();
      toast('✓ Pasted');
    } else { toast('Clipboard is empty'); }
  } catch {
    document.getElementById('input-pattern').focus();
    toast('Tap the field and hold to paste');
  }
}

// ── External links ─────────────────────────────────────────────
function openJisho() {
  const p = document.getElementById('input-pattern').value.trim();
  if (!p) { toast('Enter a pattern first'); return; }
  window.open(`https://jisho.org/search/${encodeURIComponent(p.replace(/^[〜～\s]+/,''))}`, '_blank');
}
function openBunpro() {
  const p = document.getElementById('input-pattern').value.trim();
  if (!p) { toast('Enter a pattern first'); return; }
  window.open(`https://bunpro.jp/search?q=${encodeURIComponent(p.replace(/^[〜～\s]+/,''))}`, '_blank');
}

// ── Save ───────────────────────────────────────────────────────
function doSave() {
  const pattern = document.getElementById('input-pattern').value.trim();
  if (!pattern) { toast('Enter a grammar pattern first'); return; }
  const entries = loadEntries();
  entries.unshift({
    id: Date.now(), pattern,
    jlpt:   selectedJLPT,
    source: document.getElementById('input-source').value.trim(),
    notes:  document.getElementById('input-notes').value.trim(),
    date:   new Date().toISOString(),
    addedToBunpro: false
  });
  saveEntries(entries);
  toast('✓ Saved!');
  document.getElementById('input-pattern').value = '';
  document.getElementById('input-source').value  = '';
  document.getElementById('input-notes').value   = '';
  resetJLPT();
}

// ── Export ─────────────────────────────────────────────────────
function exportLog() {
  const entries = loadEntries();
  if (!entries.length) { toast('Nothing to export yet'); return; }
  const lines = ['Pattern\tJLPT\tSource\tNotes\tDate\tAdded to Bunpro'];
  entries.forEach(e => lines.push([e.pattern, e.jlpt||'', e.source||'', e.notes||'', e.date.slice(0,10), e.addedToBunpro?'Yes':'No'].join('\t')));
  const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'grammar-log.txt'; a.click();
  URL.revokeObjectURL(url);
  toast('✓ Exported!');
}

// ── JLPT filter ────────────────────────────────────────────────
function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll('.filter-pill').forEach(p => {
    p.className = 'filter-pill' + (p.dataset.filter === f ? ' active-' + f : '');
  });
  renderLog();
}

// ── Render Log ─────────────────────────────────────────────────
function renderLog() {
  const query = (document.getElementById('log-search')?.value || '').toLowerCase();
  let entries = loadEntries();
  if (query) entries = entries.filter(e =>
    e.pattern.toLowerCase().includes(query) ||
    (e.source||'').toLowerCase().includes(query) ||
    (e.notes||'').toLowerCase().includes(query) ||
    (e.jlpt||'').toLowerCase().includes(query)
  );
  if (activeFilter !== 'all') {
    entries = entries.filter(e => activeFilter === 'none' ? !e.jlpt : e.jlpt === activeFilter);
  }
  const pending = loadEntries().filter(e => !e.addedToBunpro).length;
  document.getElementById('pending-info').innerHTML = pending
    ? `<span class="pending-badge">${pending} pending Bunpro</span>` : '';

  const list = document.getElementById('log-list');
  if (!entries.length) {
    list.innerHTML = (query || activeFilter !== 'all')
      ? '<div class="empty-state"><div class="big">🔍</div>No results.</div>'
      : '<div class="empty-state"><div class="big">📖</div>No entries yet.<br>Capture your first grammar point!</div>';
    return;
  }
  list.innerHTML = '';
  entries.forEach(e => {
    const fmt = new Date(e.date).toLocaleDateString('en-GB', { day:'numeric', month:'short' });
    const q   = encodeURIComponent(e.pattern.replace(/^[〜～\s]+/,''));
    const el  = document.createElement('div');
    el.className = 'log-entry';
    el.innerHTML = `
      <div class="log-entry-top">
        <span class="log-pattern">${e.pattern}</span>
        <div class="log-meta">
          ${e.jlpt ? `<span class="jlpt-badge badge-${e.jlpt}">${e.jlpt}</span>` : ''}
          ${e.addedToBunpro ? '<span class="added-badge">✓ In Bunpro</span>' : `<span class="log-date">${fmt}</span>`}
        </div>
      </div>
      ${e.source ? `<div class="log-source">📚 ${e.source}</div>` : ''}
      ${e.notes  ? `<div class="log-notes">${e.notes}</div>`      : ''}
      <div class="log-actions">
        <a class="log-action-btn jisho"  href="https://jisho.org/search/${q}" target="_blank" rel="noopener">Jisho</a>
        <a class="log-action-btn bunpro" href="https://bunpro.jp/search?q=${q}" target="_blank" rel="noopener">Bunpro</a>
        ${!e.addedToBunpro ? `<button class="log-action-btn added" onclick="markAdded(${e.id})">✓ Added</button>` : ''}
        <button class="log-action-btn del" onclick="deleteEntry(${e.id})">✕</button>
      </div>`;
    list.appendChild(el);
  });
}

function markAdded(id) {
  const entries = loadEntries();
  const e = entries.find(x => x.id === id);
  if (e) { e.addedToBunpro = true; saveEntries(entries); renderLog(); toast('✓ Marked as added!'); }
}
function deleteEntry(id) {
  saveEntries(loadEntries().filter(x => x.id !== id));
  renderLog();
}

// ── OCR ───────────────────────────────────────────────────────
function triggerCamera() { document.getElementById('camera-input').click(); }

function handleImage(event) {
  const file = event.target.files[0];
  if (!file) return;
  event.target.value = '';
  document.getElementById('ocr-modal').classList.add('open');
  const preview = document.getElementById('ocr-preview');
  preview.src = URL.createObjectURL(file);
  preview.classList.add('visible');
  document.getElementById('ocr-output').innerHTML = '';
  document.getElementById('ocr-status').innerHTML = '<span class="loading-spinner"></span>';
  document.getElementById('ocr-progress-wrap').style.display = 'block';
  document.getElementById('ocr-bar').style.width = '0%';
  runOCR(file);
}

async function runOCR(file) {
  const status = document.getElementById('ocr-status');
  const bar    = document.getElementById('ocr-bar');
  const output = document.getElementById('ocr-output');
  try {
    const result = await Tesseract.recognize(file, 'jpn', {
      logger: m => {
        if (m.status === 'recognizing text') { bar.style.width = Math.round(m.progress*100)+'%'; status.textContent = `Scanning… ${Math.round(m.progress*100)}%`; }
        else if (m.status === 'loading tesseract core')     status.textContent = 'Loading OCR engine…';
        else if (m.status === 'initializing tesseract')     status.textContent = 'Initialising…';
        else if (m.status === 'loading language traineddata') status.textContent = 'Loading Japanese data… (first time only)';
      }
    });
    document.getElementById('ocr-progress-wrap').style.display = 'none';
    status.textContent = '';
    const lines = result.data.text.split('\n').map(l=>l.trim()).filter(l=>l.length>0&&/[\u3000-\u9fff\uff00-\uffef]/.test(l));
    if (!lines.length) { output.innerHTML='<div class="ocr-hint">No Japanese text detected.<br>Try a clearer photo with the text filling the frame.</div>'; return; }
    output.innerHTML='<div class="ocr-results-label" style="margin-bottom:8px">Tap a line to use as your pattern</div><div class="ocr-results" id="ocr-lines"></div>';
    const container = document.getElementById('ocr-lines');
    lines.forEach(line => {
      const el = document.createElement('div');
      el.className = 'ocr-line'; el.textContent = line;
      el.onclick = () => {
        document.getElementById('input-pattern').value = line;
        onPatternInput();
        closeOCR();
        toast('✓ Pattern inserted');
      };
      container.appendChild(el);
    });
  } catch(err) {
    document.getElementById('ocr-progress-wrap').style.display = 'none';
    status.textContent = '';
    output.innerHTML='<div class="ocr-hint">OCR failed — please try again.</div>';
  }
}

function closeOCR() {
  document.getElementById('ocr-modal').classList.remove('open');
  const p = document.getElementById('ocr-preview');
  if (p.src) URL.revokeObjectURL(p.src);
  p.classList.remove('visible');
}

renderLog();
